[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mare"
version = "0.1.0"
description = "Mongo-Native Adaptive Retrieval Engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pymongo[srv]>=4.10.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.57.0",
  "python-dotenv>=1.0.1",
  "mcp>=1.12.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
acgc = [
  "grpcio>=1.68.0",
  "protobuf>=5.29.0",
]

[project.scripts]
mare-api = "app.main:run"
mare-mcp = "app.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
